[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiduciary-alignment"
version = "0.1.0"
description = "Experimental FCE pilot and runtime witness tooling"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0",
]

[project.scripts]
fiduciary-fce = "fiduciary.fce.cli:main"

[project.optional-dependencies]
visual = [
    "pillow>=10.0",
    "open-clip-torch>=2.0",
    "torch>=2.0",
]
smt = [
    "z3-solver>=4.12",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
